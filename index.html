<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#1D1D1F; --muted:#6E6E73; --border:#E5E5EA; --hair:#D2D2D7; --ground:#F5F5F7; --surface:#fff;
  --primary:#0071E3; --primary-d:#0062C4; --primary-s:#E8F1FD;
  --amber:#A35200; --amber-s:#FFF2E0; --red:#D70015; --red-s:#FDECEE;
  --blue:#0066CC; --blue-s:#E8F1FD; --gray:#515154; --gray-s:#F2F2F4;
  --green:#1E7F38; --green-s:#E4F6E9;
  --star:#FF9F0A;
  --g-sun:linear-gradient(180deg,#FFD60A,#FF9F0A);
  --g-grape:linear-gradient(180deg,#8C8AFF,#5E5CE6);
  --g-leaf:linear-gradient(180deg,#5EDB7A,#2DB14E);
  --g-coral:linear-gradient(180deg,#FF7A90,#FF375F);
  --g-sky:linear-gradient(180deg,#64D2FF,#0A84FF);
  --g-candy:linear-gradient(180deg,#E09BFF,#BF5AF2);
  --sh-sm:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.08);
  --sh-sun:none; --sh-grape:none;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  --head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1);
  --spring:cubic-bezier(.2,.9,.3,1.2);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:#FBFBFD;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary);cursor:pointer;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(0,113,227,.4);outline-offset:2px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.022em;margin:0;font-weight:600}
h1{font-size:34px;line-height:1.12} h2{font-size:19px} h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:12.5px} .b{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-sm)}
.pad{padding:20px}.pad24{padding:24px}
.label{font-size:12px;font-weight:500;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
.gtext,.gtext-grape{color:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:980px;font-weight:500;font-size:14px;border:1px solid transparent;background:var(--gray-s);color:var(--ink);white-space:nowrap;transition:background .2s var(--ease),transform .15s var(--ease),opacity .2s}
.btn:hover{background:#E8E8ED}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.danger{color:var(--red)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:background .2s}
.iconbtn:hover{background:var(--gray-s)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#FF3B30;border:2px solid #fff}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-green{background:var(--green-s);color:var(--green)}
.p-amber{background:var(--amber-s);color:var(--amber)}
.p-red{background:var(--red-s);color:var(--red)}
.p-blue{background:var(--blue-s);color:var(--blue)}
.p-gray{background:var(--gray-s);color:var(--gray)}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;background:rgba(118,118,128,.12);border-radius:10px}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:8px;border:none;background:transparent;font-weight:500;font-size:13px;color:var(--ink);transition:background .25s var(--ease),box-shadow .25s}
.tab .ct{font-size:11.5px;color:var(--muted)}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:#fff;font-weight:500;font-size:13px;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:#B0B0B5}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:13px}
.input{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--hair);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
textarea.input{min-height:110px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.warn{font-size:12.5px;color:var(--red);font-weight:500}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:#E9E9EB;border:none;flex:none;transition:background .25s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .3s var(--spring);box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08)}
.switch.on{background:#34C759}
.switch.on::after{left:22px}

.logo{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:21px;letter-spacing:-.02em;color:var(--ink)}
.logo img{width:40px;height:auto;transition:transform .5s var(--spring)}
.logo:hover img{transform:rotate(-8deg) scale(1.06)}
.logo{border:none;background:none;padding:0;cursor:pointer}
.logo-mark{width:30px;height:30px;flex:none;transition:transform .4s var(--spring)}
.logo:hover .logo-mark{transform:scale(1.06)}
.empty-ic,.tip-ic{width:44px;height:44px;border-radius:50%;background:var(--gray-s);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.tip-ic{width:34px;height:34px;background:#fff;color:#BF6A00}
.toast-ic{width:26px;height:26px;border-radius:50%;background:#34C759;color:#fff;display:flex;align-items:center;justify-content:center}
.hero-side{position:relative;z-index:1;margin-left:auto;width:300px;padding:14px 16px;border-radius:16px;box-shadow:var(--sh-md);animation:float 6s ease-in-out infinite}

.c-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.c-header .in{max-width:1200px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.navl{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;font-weight:500;color:var(--muted);border:none;background:none;transition:color .2s,background .2s}
.navl:hover{color:var(--ink)}
.navl.on{color:var(--ink);background:var(--gray-s)}
.c-main{max-width:1200px;margin:0 auto;padding:32px 24px 80px}

.p-shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:rgba(246,246,248,.85);backdrop-filter:blur(20px);border-right:1px solid rgba(0,0,0,.08);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.sidel{position:relative;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;font-weight:500;color:var(--ink);border:none;background:none;width:100%;text-align:left;transition:background .15s}
.sidel svg{color:var(--primary)}
.sidel:hover{background:rgba(0,0,0,.04)}
.sidel.on{background:rgba(0,0,0,.07);font-weight:600}
.sidel .bdg{margin-left:auto;font-size:11.5px;min-width:20px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--primary);color:#fff;font-weight:600}
.side-tip{position:relative;border-radius:14px;padding:14px;background:#fff;border:1px solid var(--border);color:var(--muted);font-size:12.5px}
.side-tip img{position:absolute;right:-4px;top:-38px;width:60px;animation:float 4s ease-in-out infinite}
.p-main{flex:1 1 auto;min-width:0;padding:22px 36px 80px}
.p-top{display:none}
.p-topbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:10px}

.avatar{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.av-sq{border-radius:10px}
.av-ring{box-shadow:none}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.split-l{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.split3{grid-template-columns:220px minmax(0,1fr) 300px}.split380{grid-template-columns:minmax(0,1fr) 390px}.split-job{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}.split-rev{grid-template-columns:320px minmax(0,1fr)}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px 32px;background:#fff;border:1px solid var(--border);box-shadow:var(--sh-sm);margin-bottom:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-height:180px}
.hero::before{content:"";position:absolute;width:420px;height:420px;right:-80px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.28),rgba(255,214,10,0) 65%);pointer-events:none}
.hero.grape::before{background:radial-gradient(circle,rgba(10,132,255,.16),rgba(10,132,255,0) 65%)}
.hero h1{font-size:30px}
.hero .sub{color:var(--muted);font-size:16px;max-width:520px}
.hero .mascot{position:absolute;right:34px;bottom:-12px;width:160px;animation:float 5s ease-in-out infinite;z-index:1}
.hero .btn{z-index:1}
.hero .btn.glass{background:#fff;border-color:var(--hair);color:var(--ink)}
.hero .btn.glass:hover{background:var(--gray-s)}
.hero-content{position:relative;z-index:1;flex:1 1 380px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:13px;font-weight:600;color:#BF6A00}

.stat{transition:transform .3s var(--ease),box-shadow .3s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.stat .v{font-family:var(--head);font-size:30px;font-weight:600;letter-spacing:-.02em}
.stat .bub{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.stat .bub svg{width:18px;height:18px}
.ph{border-radius:12px;background:var(--ground);border:1px dashed var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.jobcard{padding:20px;display:flex;gap:16px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.jobcard:hover,.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.lift{transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.caticon{width:44px;height:44px;border-radius:11px;background:var(--g-sky);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.stars{letter-spacing:1px;white-space:nowrap}
.stars .on{color:var(--star)} .stars .off{color:#E1E1E6}
.divider{height:1px;background:var(--border);margin:16px 0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:#FAFAFC}
.tablebox{overflow-x:auto}
.crumb{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--primary);border:none;background:none;padding:0;min-height:32px}
.crumb:hover{text-decoration:underline}
.bar-wrap{display:flex;align-items:flex-end;gap:12px;height:230px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .fill{width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:var(--primary);transform-origin:bottom;animation:grow .8s var(--ease) both}
.bar .fill.cur{background:#FF9F0A}
.bar .v{font-size:11px;color:var(--muted);font-weight:500}
.dist{display:flex;align-items:center;gap:10px;font-size:13px}
.dist .track{flex:1;height:6px;border-radius:99px;background:var(--gray-s);overflow:hidden}
.dist .track div{height:100%;background:#FF9F0A;border-radius:99px;transform-origin:left;animation:growX .9s var(--ease) both}
.stepper{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:none;background:none;text-align:left;font-weight:500;color:var(--muted);transition:background .2s}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:12.5px;flex:none;transition:all .3s var(--ease)}
.step.on{background:var(--gray-s);color:var(--ink);font-weight:600}
.step.on .n{border-color:var(--primary);background:var(--primary);color:#fff}
.step.done{color:var(--ink)}
.step.done .n{border-color:#34C759;background:#34C759;color:#fff}
.catbtn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--border);background:#fff;text-align:left;font-weight:500;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.catbtn:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.catbtn.on{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,113,227,.18)}
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;font-weight:500;animation:fadeUp .4s var(--ease)}
.banner.ok{background:var(--green-s);color:var(--green)}
.banner.bad{background:var(--red-s);color:var(--red)}
.starbtn{font-size:32px;line-height:1;background:none;border:none;padding:4px;color:#E1E1E6;transition:transform .2s var(--spring),color .2s}
.starbtn:hover{transform:scale(1.15)}
.starbtn.on{color:var(--star)}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.sum-row:last-child{border-bottom:none}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--ground)}
.tip img{width:48px;flex:none}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink);box-shadow:var(--sh-sm)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:36px 20px}
.empty img{width:96px;margin-bottom:6px}

.tracker{display:flex;align-items:center;margin:4px 0 20px}
.tracker .t{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;font-weight:500;color:var(--muted)}
.tracker .t .c{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--hair);font-size:12px}
.tracker .t.done .c{background:#34C759;border-color:#34C759;color:#fff}
.tracker .t.cur .c{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 5px rgba(0,113,227,.15)}
.tracker .t.done,.tracker .t.cur{color:var(--ink)}
.tracker .ln{flex:1;height:2px;border-radius:2px;background:var(--border);margin:0 8px 20px;overflow:hidden}
.tracker .ln.done::after{content:"";display:block;height:100%;background:#34C759;transform-origin:left;animation:growX .7s var(--ease) both}

.meter{height:6px;border-radius:99px;background:var(--gray-s);overflow:hidden}
.meter div{height:100%;border-radius:99px;transition:width .5s var(--ease),background .3s}

.notif-wrap{position:relative}
.drop{position:absolute;right:0;top:48px;width:360px;max-width:90vw;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);border:1px solid rgba(0,0,0,.08);border-radius:16px;box-shadow:var(--sh-md);padding:8px;z-index:40;animation:dropIn .25s var(--ease);transform-origin:top right}
.drop .ni{display:flex;gap:12px;padding:10px;border-radius:10px;align-items:flex-start;border:none;background:none;width:100%;text-align:left;transition:background .15s}
.drop .ni:hover{background:rgba(0,0,0,.04)}
.drop .ni.unread .b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);margin-right:6px;vertical-align:middle}
.drawer{position:fixed;top:0;right:0;height:100vh;width:390px;max-width:100vw;background:#fff;z-index:55;box-shadow:-10px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:slideIn .35s var(--ease)}
.drawer-h{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.drawer-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 13px;border-radius:18px;font-size:14px;animation:fadeUp .25s var(--ease)}

// Helpers
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, d=0) => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const cat = id => CATS.find(c => c.id === id);
const job = id => S.jobs.find(j => j.id === +id);
const bidsFor = id => S.bids.filter(b => b.job === +id && b.status !== 'withdrawn');
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
const stars = (n, size=14) => `<span class="stars" role="img" aria-label="${n} out of 5 stars" style="font-size:${size}px"><span class="on">${'★'.repeat(Math.round(n))}</span><span class="off">${'★'.repeat(5-Math.round(n))}</span></span>`;
const pill = (t, k='gray') => `<span class="pill p-${k}">${t}</span>`;
const statusPill = s => ({active:pill('Active','green'), completed:pill('Completed','blue'), canceled:pill('Canceled','gray')}[s]);
const ph = (label, h=140, icon='image') => `<div class="ph" style="height:${h}px">${ic(icon)}<span>${esc(label)}</span></div>`;
const avatar = (p, size=44, sq=true) => `<div class="avatar ${sq?'av-sq':''}" style="width:${size}px;height:${size}px;background:${p.color};color:${p.fg};font-size:${Math.round(size/3)}px">${p.initials}</div>`;
const LOGO_MARK = '<svg class="logo-mark" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="url(#bylg)"/><g transform="translate(-32 -4)" fill="#fff"><path d="M328 276 A56 56 0 0 1 440 276 L440 600 L328 600 Z M328 600 L440 600 L440 800 L384 800 A56 56 0 0 1 328 744 Z"/><path fill-rule="evenodd" d="M560 400 A200 200 0 0 1 760 600 L760 772 Q760 800 732 800 L384 800 L384 600 L360 600 A200 200 0 0 1 560 400 Z M560 506 A94 94 0 1 0 560 694 A94 94 0 1 0 560 506 Z"/></g></svg>';
const logo = () => `<button class="logo" data-act="go" data-v="welcome" aria-label="${BRAND.join('')} home">${LOGO_MARK}<span>${BRAND.join('')}</span></button>`;
const emptyState = (title, sub='') => `<div class="card empty"><span class="empty-ic">${ic('search')}</span><h3>${title}</h3>${sub?`<span class="muted">${sub}</span>`:''}</div>`;
const mascotTip = (text) => `<div class="tip"><span class="tip-ic">${ic('sparkle','sm')}</span><div class="bubble">${text}</div></div>`;
const tabs = (items, cur, act) => `<div class="tabs" role="tablist">${items.map(([k,l,c]) => `<button class="tab ${cur===k?'on':''}" role="tab" aria-selected="${cur===k}" data-act="${act}" data-v="${k}">${l}${c!==undefined?`<span class="ct">${c}</span>`:''}</button>`).join('')}</div>`;
const dobFmt = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `<span class="toast-ic">${ic('check','sm')}</span>` + esc(msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function modal(html){ $('#layer').innerHTML = `<div class="overlay" data-act="closeModalBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#layer input, #layer textarea, #layer select'); if (f) f.focus(); }

function go(view, param=null){
  S.view = view; S.param = param;
  S.role = view==='welcome' ? 'welcome' : view.startsWith('p-') ? 'provider' : 'customer'; S.notifOpen=false;
  render(); window.scrollTo(0,0);
}

function bell(){
  const unread = (S.notifs[S.role]||[]).some(n=>n.unread);

}

function strength(j, F){
  const amt = +F.amount || 0, bids = bidsFor(j.id).filter(b=>b.provider!==ME);
  const avg = bids.length ? bids.reduce((a,b)=>a+b.amount,0)/bids.length : j.price_max;
  let sc = 0;
  if (amt >= j.min_price && amt <= j.price_max) sc += 40; else if (amt) sc += 15;
  if (amt && amt <= avg) sc += 20;
  sc += Math.min(40, Math.round((F.description||'').trim().length / 3));
  const [lab, g] = sc>=80?['Strong bid','var(--g-leaf)']:sc>=50?['Good bid','var(--g-sun)']:['Needs work','var(--g-coral)'];
  const tipTxt = !amt?'Add your price to see how you compare.':amt<j.min_price?'Below the client\'s minimum, may look unrealistic.':amt>avg?`Avg bid is ${money(avg)}. Explain your extra value.`:(F.description||'').length<80?'Add more detail: timing, parts, warranty.':'Nice! Clear price and a detailed proposal.';
  return `<div class="col gap4" style="margin-bottom:12px"><div class="row between small"><span class="b">Bid strength</span><span class="b">${lab}</span></div><div class="meter"><div style="width:${Math.max(6,sc)}%;background:${g}"></div></div><span class="hint">${tipTxt}</span></div>`;
}
function feeBox(j, F, fee){
  const amt = +F.amount || 0;
  const low = amt && amt < j.min_price;
  return `${low?`<div class="warn" style="margin:-6px 0 8px">Below the client's minimum of ${money(j.min_price)}.</div>`:''}
    ${strength(j, F)}
    <div class="col small" style="padding:12px;border-radius:14px;background:var(--ground)">
      <div class="sum-row"><span class="muted">Your bid</span><span class="b">${money(amt,2)}</span></div>
      <div class="sum-row"><span class="muted">Service fee (${fee}%)</span><span class="b">-${money(amt*fee/100,2)}</span></div>
      <div class="sum-row"><span class="b">You'll receive</span><span class="b" style="color:var(--primary-d)">${money(amt*(1-fee/100),2)}</span></div>
    </div>`;
}

}

// Render and events
const VIEWS = {'welcome':vWelcome,'c-jobs':vCustomerJobs,'c-post':vCustomerPost,'c-job':vCustomerJob,'c-provider':vCustomerProvider,
  'p-feed':vProviderFeed,'p-job':vProviderJob,'p-bids':vProviderBids,'p-fin':vProviderFin,'p-reviews':vProviderReviews,'p-services':vProviderServices,'p-team':vProviderTeam,'p-portfolio':vProviderPortfolio};
let prevView = null, history_ = [];
let lastView = null;
function render(){
  if (S.view === 'welcome') $('#app').innerHTML = vWelcome();
  else { const content = VIEWS[S.view](); $('#app').innerHTML = S.role==='customer' ? customerShell(content) : providerShell(content); }
  const changed = lastView !== S.view; lastView = S.view;
  const main = $('#app .c-main') || $('#app .p-main') || $('#app .welcome');
  if (changed && main){ main.classList.add('enter'); runCounters(); setTimeout(() => main.classList.remove('enter'), 1300); }
  document.title = BRAND.join('') + ' | ' + (S.role==='customer'?'Client':S.role==='provider'?'Provider':'Welcome');
}


const ACT = {
  go:(v,p)=>{ history_.push([S.view,S.param]); if (v==='c-provider') S.ui.provTab='overview'; go(v, p && isNaN(p) ? p : (p?+p:null)); },
  back:()=>{ const h = history_.pop(); h ? go(h[0],h[1]) : go('c-jobs'); },
  cTab:v=>{S.ui.cTab=v;render();}, bidSort:v=>{S.ui.bidSort=v;render();}, provTab:v=>{S.ui.provTab=v;render();},
  bidsTab:v=>{S.ui.bidsTab=v;render();}, finRange:v=>{S.ui.finRange=v;render();}, txTab:v=>{S.ui.txTab=v;render();},
  revTab:v=>{S.ui.revTab=v;render();}, teamSite:v=>{S.ui.teamSite=v;render();}, pfTag:v=>{S.ui.pfTag=v;render();},
  feedCat:v=>{S.ui.feedCat=v;render();}, feedIncl:()=>{S.ui.feedIncl=!S.ui.feedIncl;render();},
  notify:()=>{ S.notifOpen=!S.notifOpen; render(); },
  notifRead:()=>{ S.notifs[S.role].forEach(n=>n.unread=false); render(); },
  closeChat:()=>{ S.chat.open=false; renderDrawer(); },
  chatSend:()=>sendChat(),
  chatQuick:v=>{ $('#chatIn').value=v; sendChat(); },
  cmpToggle:(v,p,e)=>{ const id=+p; if(S.compare.includes(id)) S.compare=S.compare.filter(x=>x!==id); else { if(S.compare.length>=3){ e.target.checked=false; toast('Compare up to 3 bids'); return; } S.compare.push(id);} render(); },
  cmpClear:()=>{ S.compare=[]; render(); },
  cmpOpen:()=>compareModal(),
  msg:(v,p)=>openChat(p),
  saved:()=>toast('Profile saved'),
  closeModal, closeModalBg:(v,p,e)=>{ if (e.target.classList.contains('overlay')) closeModal(); },

  // customer
  reviewOpen:(v,p)=>reviewModal(+p),
  rvStar:v=>{ S.ui.rv.stars=+v; document.querySelectorAll('#starRow .starbtn').forEach((b,i)=>b.classList.toggle('on', i < +v)); },
  rvSubmit:()=>{ const t=$('#rvText').value.trim(); if(!S.ui.rv.stars){$('#rvWarn').textContent='Pick a star rating.';return;} if(t.length<5){$('#rvWarn').textContent='Write a few words about the job.';return;}
    job(S.ui.rv.id).review={stars:S.ui.rv.stars,text:t,response:''}; closeModal(); render(); toast('Review posted'); },
  repost:(v,p)=>{ const j=job(p); const n=Math.max(...S.jobs.map(x=>x.id))+1; S.jobs.unshift({...j,id:n,status:'active',is_active:true,posted:'Just now',date:'2026-11-21',review:null}); S.ui.cTab='active'; render(); toast('Reposted as #J-'+n); },
  cancelJob:(v,p)=>{ const j=job(p); j.status='canceled'; j.is_active=false; S.bids.filter(b=>b.job===j.id).forEach(b=>{b.is_active=false;}); render(); toast('Job canceled'); },
  toggleAllBids:()=>{S.ui.showAllBids=!S.ui.showAllBids;render();},
  shortlist:(v,p)=>{ S.ui.shortlist[p]=!S.ui.shortlist[p]; const b=S.bids.find(x=>x.id===+p); b.app_status=S.ui.shortlist[p]?'Shortlisted':'Under review'; render(); },
  acceptBid:(v,p)=>{ const b=S.bids.find(x=>x.id===+p); S.bids.filter(x=>x.job===b.job).forEach(x=>{ if(x.id===b.id){x.is_won=true;x.status='accepted';x.app_status='Hired · In progress';} else if(x.status==='pending'){x.status='lost';x.app_status='Not selected';x.is_active=false;} });
    job(b.job).is_active=false; S.compare=[]; closeModal(); render(); confetti(); toast('Hired '+PROVIDERS[b.provider].name); },
  invite:()=>{S.ui.invited=true;render();toast('Invitation sent');},
  // post job
  pCat:v=>{const P=S.ui.post;P.cat=+v;P.sub=null;render();}, pSub:v=>{S.ui.post.sub=v;render();},
  pProp:v=>{S.ui.post.property=v;render();}, pImg:()=>{S.ui.post.images++;render();},
  pIncl:()=>{S.ui.post.inclusive=!S.ui.post.inclusive;render();},
  pNext:()=>{S.ui.post.step++;render();}, pBack:()=>{S.ui.post.step--;render();}, pStep:v=>{S.ui.post.step=+v;render();},
  pPost:()=>{ const P=S.ui.post; const n=Math.max(...S.jobs.map(x=>x.id))+1;
    S.jobs.unshift({id:n, client:MY_CLIENT, cat:P.cat, sub:P.sub, min_price:+P.min, price_max:+P.max, address:P.address, property_type:P.property, problem:P.problem, date:P.date, images:P.images, status:'active', isInclusive:P.inclusive, is_active:true, posted:'Just now', dist:'2.4 mi'});
    P.posted=n; render(); confetti(); },
  postAnother:()=>{S.ui.post=newPost();render();},

  // provider
  saveJob:(v,p)=>{ S.saved[p]=!S.saved[p]; render(); toast(S.saved[p]?'Job saved':'Removed from saved'); },
  submitBid:(v,p)=>{ const F=S.ui.bidForm, j=job(p); const amt=+F.amount;
    if(!amt){$('#bidErr').textContent='Enter a proposed amount.';return;} if(F.description.trim().length<10){$('#bidErr').textContent='Add a short proposal (10+ characters).';return;}
    const mine=S.bids.find(b=>b.job===j.id&&b.provider===ME&&b.status!=='withdrawn');
    if(mine){ Object.assign(mine,{amount:amt,duration:F.duration,description:F.description.trim()}); F.editing=false; toast('Bid updated'); }
    else { S.bids.push({id:Math.max(...S.bids.map(b=>b.id))+1, job:j.id, provider:ME, amount:amt, duration:F.duration, description:F.description.trim(), status:'pending', app_status:'Under review', is_active:true, is_won:false, submitted:'Nov 7, 2026'}); toast('Bid sent to '+CLIENTS[j.client].name); setTimeout(confetti,50); }
    render(); },
  editBid:()=>{S.ui.bidForm.editing=true;render();}, cancelEdit:()=>{S.ui.bidForm.editing=false;render();},
  withdrawBid:(v,p)=>{ const b=S.bids.find(x=>x.id===+p); b.status='withdrawn'; b.is_active=false; b.app_status='-'; S.ui.bidForm=null; render(); toast('Bid withdrawn'); },
  withdrawOpen:()=>withdrawModal(),
  wdSubmit:()=>{ const a=+$('#wdAmt').value; if(!a||a<=0||a>S.fin.available){$('#wdErr').textContent='Enter an amount up to '+money(S.fin.available,2)+'.';return;}
    S.fin.available=Math.round((S.fin.available-a)*100)/100; S.tx.unshift({dt:'2026-11-07 19:40',type:'Withdrawal',desc:'Transfer to bank ••4821',contract:'-',gross:-a,tax:0,status:'Processing'}); closeModal(); render(); toast(money(a,2)+' on its way to your bank'); },
  replyOpen:(v,p)=>{S.ui.replyOpen=+p;render(); const t=$('#reply-'+p); t&&t.focus();}, replyCancel:()=>{S.ui.replyOpen=null;render();},
  replySave:(v,p)=>{ const t=$('#reply-'+p).value.trim(); if(!t) return; S.reviews.find(r=>r.id===+p).response=t; S.ui.replyOpen=null; render(); toast('Response posted'); },
  svcOpen:(v,p)=>svcModal(p), svcToggle:(v,p)=>{ const s=S.services.find(x=>x.id===+p); s.active=!s.active; render(); },
  svcSave:(v,p)=>{ const d={title:$('#sTitle').value.trim(), cat:+$('#sCat').value, price:+$('#sPrice').value, duration:$('#sDur').value.trim()||'-', description:$('#sDesc').value.trim()};
    if(!d.title||!d.price){$('#sErr').textContent='Title and price are required.';return;}
    if(p){ Object.assign(S.services.find(x=>x.id===+p), d); } else S.services.unshift({id:Math.max(0,...S.services.map(s=>s.id))+1, active:true, ...d});
    closeModal(); render(); toast('Service saved'); },
  svcDelete:(v,p)=>{ S.services=S.services.filter(s=>s.id!==+p); closeModal(); render(); toast('Service deleted'); },
  memberOpen:()=>memberModal(), memberToggle:(v,p)=>{ const m=S.team.find(x=>x.id===+p); m.is_active=!m.is_active; render(); },
  memberSave:()=>{ const n=$('#mName').value.trim(), r=$('#mRole').value.trim(); if(!n||!r){$('#mErr').textContent='Name and role are required.';return;}
    S.team.push({id:Math.max(...S.team.map(m=>m.id))+1, emp_name:n, role:r, contact:$('#mContact').value||'-', dob:$('#mDob').value||'2000-01-01', address:$('#mAddr').value||'-', worksite:+$('#mSite').value, is_active:true}); closeModal(); render(); toast(n+' added to the team'); },
  siteOpen:()=>siteModal(),
  siteSave:()=>{ const n=$('#wName').value.trim(); if(!n){$('#wErr').textContent='Name is required.';return;} const st=$('#wStatus').value;
    S.worksites.push({id:Math.max(...S.worksites.map(w=>w.id))+1, name:n, contact:$('#wContact').value||'-', address:$('#wAddr').value||'-', about:$('#wAbout').value||'', is_active:st==='Operational', status:st}); closeModal(); render(); toast('Worksite added'); },
  pfFeature:(v,p)=>{ const x=S.portfolio.find(i=>i.id===+p); x.featured=!x.featured; render(); },
  pfAdd:()=>pfModal(),
  pfSave:()=>{ const b=S.pastBids.find(x=>x.id===+$('#pfJob').value); S.portfolio.unshift({id:Math.max(...S.portfolio.map(x=>x.id))+1, title:b.title, client:b.client, tag:$('#pfTagSel').value, date:'Nov 2026', stars:5, featured:false, note:$('#pfNote').value.trim()||'Project details coming soon.'}); closeModal(); S.ui.pfTag='All'; render(); toast('Project added'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.v, el.dataset.p, e);
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if ($('#layer').innerHTML) closeModal(); else if (S.chat.open){ S.chat.open=false; renderDrawer(); } else if (S.notifOpen){ S.notifOpen=false; render(); } } if (e.key==='Enter' && e.target.id==='chatIn'){ e.preventDefault(); sendChat(); } });
document.addEventListener('click', e => { if (S.notifOpen && !e.target.closest('.notif-wrap')){ S.notifOpen=false; render(); } }, true);

// two-way binding without re-rendering the whole page (keeps focus while typing)
const PARTIALS = {
  summary:()=>{ const el=$('#summary'); if(el) el.innerHTML=postSummary(); const nb=$('[data-act="pNext"]'); if(nb){ const P=S.ui.post; nb.disabled=!(P.step===3?(P.date&&+P.min>0&&+P.max>=+P.min):true);} },
  feedList:()=>{ $('#feedList').innerHTML=feedList(); },
  feeBox:()=>{ const j=job(S.ui.bidForm.job); $('#feeBox').innerHTML=feeBox(j,S.ui.bidForm,10); },
};
function onBind(e){
  const el = e.target; const path = el.dataset && el.dataset.bind; if (!path) return;
  const [root, ...rest] = path.split('.');
  let o = root==='post' ? S.ui.post : root==='ui' ? S.ui : S;
  const keys = root==='post' ? rest : rest; const last = keys.pop();
  keys.forEach(k => o = o[k]); o[last] = el.value;
  if (root==='post'){ PARTIALS.summary(); const P=S.ui.post; const nb=$('[data-act="pNext"]'); if(nb && P.step===2) nb.disabled=!(P.problem.trim().length>9 && P.property && P.address.trim()); }
  if (el.dataset.rerender && PARTIALS[el.dataset.rerender]) PARTIALS[el.dataset.rerender]();
}
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);

// Welcome

  return `<div class="welcome">
    <div class="col stagger" style="position:relative;z-index:1;align-items:center;gap:4px">
      <span class="welcome-icon">${LOGO_MARK}</span>
      <span class="pill p-gray" style="font-size:13px;padding:5px 14px;margin:6px 0">Jobs and bidding marketplace</span>
      <h1>Get it done.<br><span class="muted">Hire the right pro.</span></h1>
      <p class="muted" style="font-size:19px;max-width:560px;margin:14px 0 0">Post a job, compare bids from local pros, and pay only when the work is done.</p>
      <div class="role-grid">
        <button class="role" data-act="go" data-v="c-jobs">
          <span class="ico" style="background:var(--g-sun)">${ic('briefcase')}</span><h2>I need work done</h2><span class="muted">Post jobs, compare bids and hire trusted pros.</span><span class="go">Continue as client ${ic('chevR','sm')}</span>
        </button>
        <button class="role" data-act="go" data-v="p-feed">
          <span class="ico" style="background:var(--g-sky)">${ic('award')}</span><h2>I'm a service pro</h2><span class="muted">Find jobs nearby, send bids and grow your business.</span><span class="go">Continue as provider ${ic('chevR','sm')}</span>
        </button>
      </div>
      <div class="row wrap gap24" style="justify-content:center;margin-top:30px;color:var(--muted);font-size:13px">
        <span class="row">${ic('shield','sm')}Verified pros</span><span class="row">${ic('wallet','sm')}Escrow payments</span><span class="row">${ic('star','sm')}Real reviews</span>
      </div>
    </div>
  </div>`;

// Chat drawer
const now = () => new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const REPLIES = ["Sure! I can be there at 7am before you open.","Yes, all parts are included in the price.","I'll bring photos of the finished work for your records.","Happy to adjust the time slot if that works better for you.","Great, I'll confirm once the booking is in."];
function openChat(name){
  S.chat.open = true; S.chat.with = name;
  if (!S.chat.threads[name]) S.chat.threads[name] = [{from:'them', text:`Hi! Thanks for reaching out to ${name}. How can I help?`, tm:now()}];
  renderDrawer(); setTimeout(()=>{ const i=$('#chatIn'); i&&i.focus(); }, 100);
}
function renderDrawer(){
  const d = $('#drawer');
  if (!S.chat.open){ d.innerHTML=''; return; }
  const name = S.chat.with, th = S.chat.threads[name];
  const ini = name.split(' ').map(w=>w[0]).slice(0,2).join('');
  d.innerHTML = `<aside class="drawer" role="dialog" aria-label="Chat with ${esc(name)}">
    <div class="drawer-h"><div class="avatar" style="background:var(--g-sky);color:#fff">${ini}</div><div class="col grow"><span class="b">${esc(name)}</span><span class="small" style="color:var(--green)">Online</span></div><button class="iconbtn" aria-label="Close chat" data-act="closeChat">${ic('x')}</button></div>
    <div class="drawer-b" id="chatBody">
      ${th.map(m=>`<div class="msg ${m.from}">${esc(m.text)}<span class="tm">${m.tm}</span></div>`).join('')}
      ${S.chat.typing?'<div class="typing"><span></span><span></span><span></span></div>':''}
    </div>
    <div class="row wrap" style="gap:6px;padding:10px 12px 0">${['When can you start?','Are parts included?','Can you send photos?'].map(q=>`<button class="chip small" style="min-height:32px" data-act="chatQuick" data-v="${q}">${q}</button>`).join('')}</div>
    <div class="drawer-f"><input id="chatIn" class="input" placeholder="Type a message..." aria-label="Message"><button class="btn primary" data-act="chatSend" aria-label="Send">${ic('send','sm')}</button></div>
  </aside>`;
  const b = $('#chatBody'); b.scrollTop = b.scrollHeight;
}
function sendChat(){
  const inp = $('#chatIn'); const t = inp && inp.value.trim(); if (!t) return;
  const th = S.chat.threads[S.chat.with]; th.push({from:'me', text:t, tm:now()}); renderDrawer();
  setTimeout(()=>{ S.chat.typing = true; renderDrawer(); }, 350);
  setTimeout(()=>{ S.chat.typing = false; th.push({from:'them', text:REPLIES[(th.length) % REPLIES.length], tm:now()}); renderDrawer(); }, 1700);
}

// Compare bids
function compareModal(){
  const bs = S.compare.map(id => { const b = S.bids.find(x=>x.id===id); return {...b, p:PROVIDERS[b.provider]}; });
  const minAmt = Math.min(...bs.map(b=>b.amount)), maxRt = Math.max(...bs.map(b=>b.p.rating)), maxJobs = Math.max(...bs.map(b=>b.p.jobs));
  const best = '<span class="pill p-green" style="margin-left:6px">Best</span>';
  const rows = [
    ['Price', b=>`<span class="b" style="font-size:18px">${money(b.amount)}</span>${b.amount===minAmt?best:''}`],
    ['Rating', b=>`${stars(b.p.rating,13)} <b>${b.p.rating.toFixed(1)}</b>${b.p.rating===maxRt?best:''}`],
    ['Reviews', b=>b.p.reviews],
    ['Jobs done', b=>`${b.p.jobs}${b.p.jobs===maxJobs?best:''}`],
    ['Duration', b=>b.duration],
    ['Replies', b=>b.p.response],
    ['Verified', b=>b.p.verified?`<span class="pill p-green">${ic('shield','sm')}Yes</span>`:'<span class="muted">No</span>'],
  ];
  $('#layer').innerHTML = `<div class="overlay" data-act="closeModalBg"><div class="modal wide" role="dialog" aria-modal="true">
    <div class="row between" style="margin-bottom:16px"><h2>Compare bids</h2><button class="iconbtn" aria-label="Close" data-act="closeModal">${ic('x')}</button></div>
    <div class="tablebox"><table>
      <thead><tr><th></th>${bs.map(b=>`<th style="text-transform:none;letter-spacing:0"><div class="row gap12">${avatar(b.p,36)}<span class="b" style="color:var(--ink);font-size:14px">${b.p.name}</span></div></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([l,f])=>`<tr><td class="muted b">${l}</td>${bs.map(b=>`<td>${f(b)}</td>`).join('')}</tr>`).join('')}
      <tr><td></td>${bs.map(b=>`<td><button class="btn sm primary" data-act="acceptBid" data-p="${b.id}">Hire</button></td>`).join('')}</tr></tbody>
    </table></div></div></div>`;
}

// Motion helpers
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if (reduced()) return;
  const colors = ['#FFD23F','#FF8A3D','#8B5CF6','#10B981','#FF6A88','#60A5FA'];
  for (let i=0;i<90;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100+'vw'; c.style.background = colors[i%colors.length];
    c.style.setProperty('--x', (Math.random()*300-150)+'px'); c.style.setProperty('--r', (Math.random()*900+180)+'deg');
    c.style.setProperty('--d', (Math.random()*1.4+1.8)+'s'); c.style.animationDelay = (Math.random()*0.4)+'s';
    if (i%3===0){ c.style.borderRadius='50%'; c.style.width='9px'; c.style.height='9px'; }
    document.body.appendChild(c); setTimeout(()=>c.remove(), 3800);
  }
}
function runCounters(){
  if (reduced()) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), pre = el.dataset.pre||'', dec = +(el.dataset.dec||0);
    if (isNaN(to)) return;
    const t0 = performance.now(), dur = 1000;
    const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = pre + (to*e).toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec});
      if (k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

render();

(() => {
  const intro = document.getElementById('intro'); if (!intro) return;
  const done = () => { if (intro.isConnected) intro.remove(); };
  intro.addEventListener('click', done);
  intro.addEventListener('animationend', e => { if (e.animationName === 'introOut') done(); });
  setTimeout(done, reduced() ? 1200 : 3400);
})();
</script>
